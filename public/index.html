<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Comparador de Inmuebles</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f5f6fa;font-family:'Outfit',sans-serif;color:#1e293b}
.hdr{background:#fff;border-bottom:1px solid #e2e8f0;padding:12px 20px;position:sticky;top:0;z-index:50;box-shadow:0 1px 6px rgba(0,0,0,.04)}
.hdr-in{max-width:1440px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.hdr h1{font-size:16px;font-weight:700;color:#1e3a5f;display:flex;align-items:center;gap:8px}
.hdr h1 span{font-size:20px}
.hdr-acts{display:flex;gap:6px}
.btn{padding:7px 14px;border-radius:7px;border:none;cursor:pointer;font-size:11px;font-weight:600;font-family:inherit;transition:.15s}
.btn-p{background:#2563eb;color:#fff}.btn-p:hover{background:#1d4ed8}
.btn-s{background:#f1f5f9;color:#475569;border:1px solid #e2e8f0}.btn-s:hover{background:#e2e8f0}
.wrap{max-width:1440px;margin:0 auto;padding:14px 20px}
.tabs{display:flex;gap:2px;background:#e2e8f0;padding:3px;border-radius:9px;margin-bottom:14px;overflow-x:auto}
.tab{padding:7px 14px;border-radius:7px;border:none;cursor:pointer;font-size:11px;font-weight:600;font-family:inherit;background:transparent;color:#64748b;transition:.2s;white-space:nowrap}
.tab.on{background:#2563eb;color:#fff;box-shadow:0 2px 8px #2563eb33}
.panel{display:none}.panel.show{display:block}
.props{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.prop{min-width:310px;max-width:360px;flex:1;background:#fff;border-radius:12px;border:1px solid #e2e8f0;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.03)}
@media(max-width:768px){.props{flex-direction:column}.prop{min-width:100%;max-width:100%}}
.prop-photo{height:130px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;position:relative;background-size:cover;background-position:center}
.prop-photo span{color:#94a3b8;font-size:28px}
.prop-body{padding:12px 14px}
.fg{margin-bottom:6px}
.fg label{display:block;font-size:9px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.7px;margin-bottom:1px}
.fg input,.fg select{width:100%;padding:5px 8px;border-radius:5px;border:1px solid #e2e8f0;font-size:12px;font-family:inherit;background:#fff;color:#1e293b;outline:none}
.fg input:focus,.fg select:focus{border-color:#2563eb;box-shadow:0 0 0 2px #2563eb15}
.fg input.mn{font-family:'JetBrains Mono',monospace;text-align:right;font-size:11px}
.fg input.calc{background:#eff6ff;border-color:#bfdbfe;color:#1e40af;font-weight:600}
.fg input.calc-g{background:#f0fdf4;border-color:#bbf7d0;color:#166534;font-weight:600}
.fg input.calc-r{background:#fef2f2;border-color:#fecaca;color:#991b1b;font-weight:600}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.sl{font-size:9px;font-weight:700;color:#2563eb;text-transform:uppercase;letter-spacing:1.3px;margin:8px 0 5px;padding-top:7px;border-top:1px solid #f1f5f9}
.url-row{display:flex;gap:4px;margin-bottom:8px}
.url-row input{flex:1;padding:6px 8px;border-radius:6px;border:1px solid #e2e8f0;font-size:11px;background:#f8fafc}
.url-btn{padding:6px 12px;border-radius:6px;border:none;font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap;transition:.15s}
.url-btn-go{background:#059669;color:#fff}.url-btn-go:hover{background:#047857}
.url-btn-go:disabled{background:#94a3b8;cursor:wait}
.url-btn-open{background:#f1f5f9;color:#475569;border:1px solid #e2e8f0;font-size:10px}.url-btn-open:hover{background:#e2e8f0}
.rm-btn{position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:5px;background:rgba(220,38,38,.85);color:#fff;border:none;cursor:pointer;font-size:11px;font-weight:700}
.link-btn{position:absolute;top:6px;right:6px;padding:3px 8px;border-radius:5px;background:rgba(0,0,0,.6);color:#fff;font-size:9px;text-decoration:none;font-weight:600}
.loading-overlay{position:absolute;inset:0;background:rgba(255,255,255,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;border-radius:12px}
.spinner{width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* TABLE */
.cmp{overflow-x:auto;background:#fff;border-radius:12px;border:1px solid #e2e8f0;padding:16px}
.cmp table{width:100%;border-collapse:collapse;font-size:12px;min-width:600px}
.cmp th{text-align:right;padding:8px 10px;color:#64748b;font-weight:600;font-size:9px;text-transform:uppercase;letter-spacing:.7px;background:#f8fafc;border-bottom:2px solid #e2e8f0}
.cmp th:first-child{text-align:left}
.cmp td{padding:7px 10px;border-bottom:1px solid #f1f5f9;text-align:right;font-family:'JetBrains Mono',monospace;font-size:11px}
.cmp td:first-child{text-align:left;font-family:'Outfit',sans-serif;font-size:12px;font-weight:500;color:#475569}
.cmp .hl{background:#eff6ff!important}
.cmp .best{color:#059669;font-weight:700}.cmp .worst{color:#dc2626;font-weight:700}
.cmp tr:hover{background:#f8fafc}

/* RANKING */
.rank-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.rank-card{background:#fff;border-radius:12px;border:1px solid #e2e8f0;overflow:hidden}
.rank-photo{height:80px;background-size:cover;background-position:center;background-color:#f1f5f9}
.rank-body{text-align:center;padding:14px}
.rank-score{font-size:36px;font-weight:800;line-height:1}
.rank-name{font-size:11px;color:#64748b;margin-top:4px;text-transform:uppercase;letter-spacing:1px}
.rank-bar{height:7px;background:#e2e8f0;border-radius:4px;overflow:hidden;margin:8px 14px 0}
.rank-fill{height:100%;border-radius:4px}
.rank-details{padding:8px 14px 14px}
.rank-row{display:flex;justify-content:space-between;padding:2px 0;font-size:10px}
.rank-summary{margin:8px 0 0;padding:7px 10px;background:#f8fafc;border-radius:5px;font-size:10px;color:#475569}

.note{padding:10px 14px;border-radius:7px;font-size:11px;line-height:1.5;border-left:3px solid;margin-top:12px}
.note-b{background:#eff6ff;border-color:#2563eb;color:#1e40af}
.note-y{background:#fefce8;border-color:#d97706;color:#92400e}

.ftr{padding:14px;text-align:center;font-size:9px;color:#94a3b8;margin-top:20px;border-top:1px solid #e8ecf1}
</style>
</head>
<body>

<div class="hdr"><div class="hdr-in">
<h1><span>🏠</span> Comparador de Inmuebles</h1>
<div class="hdr-acts">
<button class="btn btn-p" onclick="addProp()">+ Agregar</button>
<button class="btn btn-s" onclick="resetAll()">Reiniciar</button>
</div>
</div></div>

<div class="wrap">
<div class="tabs">
<button class="tab on" onclick="showTab('editor',this)">✏️ Editor</button>
<button class="tab" onclick="showTab('tabla',this)">📊 Comparativa</button>
<button class="tab" onclick="showTab('ranking',this)">🏆 Ranking</button>
</div>
<div class="panel show" id="p-editor"><div class="props" id="props-ct"></div></div>
<div class="panel" id="p-tabla"><div class="cmp" id="cmp-ct"></div></div>
<div class="panel" id="p-ranking" id="rank-ct"></div>
</div>
<div class="ftr">Comparador de Inmuebles · Pega links de Wasi, FincaRaiz, Metrocuadrado · Los datos se extraen automáticamente con IA</div>

<script>
var COLORS=["#2563eb","#059669","#d97706","#dc2626","#7c3aed","#0891b2"];
var pid=0;
var props=[];

function E(){return{id:++pid,nombre:"",url:"",foto:"",direccion:"",tipo:"Apartamento",areaTotal:0,areaPrivada:0,estrato:0,piso:0,antiguedad:0,habitaciones:0,banos:0,parqueaderos:0,deposito:"No",vista:"Exterior",estado:"Original",valorLista:0,valorOferta:0,adminMensual:0,predialAnual:0,serviciosPromedio:0,seguroAnual:0,valorRemodelacion:0,remodelado:"No",amenidades:"",observaciones:"",loading:false}}
function fC(v){if(!v||isNaN(v))return"$0";return"$"+Math.round(v).toLocaleString("es-CO")}
function fN(v){if(!v||isNaN(v))return"";return Math.round(v).toLocaleString("es-CO")}
function C(p){var pr=p.valorOferta||p.valorLista;var m2t=p.areaTotal>0&&pr>0?pr/p.areaTotal:0;var m2p=p.areaPrivada>0&&pr>0?pr/p.areaPrivada:0;var desc=p.valorLista>0&&p.valorOferta>0?(p.valorLista-p.valorOferta)/p.valorLista*100:0;var cm=p.adminMensual+p.serviciosPromedio+p.predialAnual/12+p.seguroAnual/12;var ct=pr+p.valorRemodelacion;var m2r=p.areaTotal>0?ct/p.areaTotal:0;var c5=ct+cm*60;return{m2t:m2t,m2p:m2p,desc:desc,cm:cm,ct:ct,m2r:m2r,c5:c5,pr:pr}}

function showTab(t,btn){
  document.querySelectorAll(".tab").forEach(function(b){b.classList.remove("on")});
  if(btn)btn.classList.add("on");
  document.querySelectorAll(".panel").forEach(function(p){p.classList.remove("show")});
  document.getElementById("p-"+t).classList.add("show");
  if(t==="tabla")renderTable();
  if(t==="ranking")renderRanking();
}

function addProp(){if(props.length>=6)return;props.push(E());render()}
function resetAll(){if(!confirm("¿Reiniciar?"))return;pid=0;props=[];for(var i=0;i<3;i++)props.push(E());render()}
function removeProp(id){props=props.filter(function(p){return p.id!==id});render()}
function upd(id,k,v){var p=props.find(function(x){return x.id===id});if(p)p[k]=v}

// ── Auto-scrape via serverless function ──
function scrape(id){
  var p=props.find(function(x){return x.id===id});
  if(!p||!p.url)return alert("Pega un link primero");
  p.loading=true;render();
  
  fetch("/.netlify/functions/scrape?url="+encodeURIComponent(p.url))
    .then(function(r){return r.json()})
    .then(function(res){
      p.loading=false;
      if(res.success&&res.data){
        var d=res.data;
        if(d.nombre)p.nombre=d.nombre;
        if(d.foto)p.foto=d.foto;
        if(d.direccion)p.direccion=d.direccion+(d.barrio?" · "+d.barrio:"")+(d.ciudad?" · "+d.ciudad:"");
        if(d.tipo)p.tipo=d.tipo;
        if(Number(d.areaTotal)>0)p.areaTotal=Number(d.areaTotal);
        if(Number(d.areaPrivada)>0)p.areaPrivada=Number(d.areaPrivada);
        if(Number(d.estrato)>0)p.estrato=Number(d.estrato);
        if(Number(d.piso)>0)p.piso=Number(d.piso);
        if(Number(d.antiguedad)>0)p.antiguedad=Number(d.antiguedad);
        if(Number(d.habitaciones)>0)p.habitaciones=Number(d.habitaciones);
        if(Number(d.banos)>0)p.banos=Number(d.banos);
        if(Number(d.parqueaderos)>0)p.parqueaderos=Number(d.parqueaderos);
        if(d.deposito)p.deposito=d.deposito;
        if(d.vista)p.vista=d.vista;
        if(d.estado)p.estado=d.estado;
        if(Number(d.valorLista)>0)p.valorLista=Number(d.valorLista);
        if(Number(d.adminMensual)>0)p.adminMensual=Number(d.adminMensual);
        if(Number(d.predialAnual)>0)p.predialAnual=Number(d.predialAnual);
        if(d.amenidades)p.amenidades=d.amenidades;
        if(d.descripcion)p.observaciones=d.descripcion.substring(0,200);
      } else {
        alert("No se pudieron extraer datos automáticamente"+(res.error?": "+res.error:"")+". Puedes editar manualmente.");
      }
      render();
    })
    .catch(function(e){
      p.loading=false;render();
      alert("Error de conexión: "+e.message+". Verifica que la función serverless esté desplegada.");
    });
}

function fg(label,id,key,type,cls){
  var p=props.find(function(x){return x.id===id});
  var v=p[key];
  var readOnly=!!cls;
  var inputCls="";if(cls==="b")inputCls="calc";if(cls==="g")inputCls="calc-g";if(cls==="r")inputCls="calc-r";
  if(type==="money"&&!readOnly){
    return'<div class="fg"><label>'+label+'</label><input class="mn" value="'+(v?fN(v):"")+'" placeholder="0" onchange="upd('+id+',\''+key+'\',parseInt(this.value.replace(/[^0-9]/g,\'\'))||0);render()"/></div>';
  }
  if(type==="number"&&!readOnly){
    return'<div class="fg"><label>'+label+'</label><input type="number" class="mn" value="'+(v||"")+'" onchange="upd('+id+',\''+key+'\',parseFloat(this.value)||0);render()" onfocus="if(this.value==0)this.value=\'\'"/></div>';
  }
  if(readOnly){
    return'<div class="fg"><label>'+label+'</label><input class="mn '+inputCls+'" readonly value="'+v+'"/></div>';
  }
  return'<div class="fg"><label>'+label+'</label><input value="'+(v||"")+'" placeholder="" onchange="upd('+id+',\''+key+'\',this.value)"/></div>';
}
function fgSel(label,id,key,opts){
  var p=props.find(function(x){return x.id===id});
  var h='<div class="fg"><label>'+label+'</label><select onchange="upd('+id+',\''+key+'\',this.value);render()">';
  opts.forEach(function(o){h+='<option'+(p[key]==o?' selected':'')+'>'+o+'</option>'});
  return h+'</select></div>';
}

function render(){
  var ct=document.getElementById("props-ct");
  var h="";
  props.forEach(function(p,idx){
    var c=C(p);var color=COLORS[idx%COLORS.length];
    var photoStyle=p.foto?'background-image:url('+p.foto+')':'';
    
    h+='<div class="prop" style="border-top:4px solid '+color+';position:relative">';
    if(p.loading)h+='<div class="loading-overlay"><div class="spinner"></div><div style="margin-top:8px;font-size:11px;color:#64748b;font-weight:600">Extrayendo datos con IA...</div></div>';
    
    // Photo
    h+='<div class="prop-photo" style="'+photoStyle+'">';
    if(!p.foto)h+='<span>📷</span>';
    if(props.length>1)h+='<button class="rm-btn" onclick="removeProp('+p.id+')">✕</button>';
    if(p.url)h+='<a class="link-btn" href="'+p.url+'" target="_blank">Ver anuncio ↗</a>';
    h+='</div>';
    
    h+='<div class="prop-body">';
    // URL + auto-fill
    h+='<div class="url-row">';
    h+='<input value="'+(p.url||"")+'" placeholder="Pega link de Wasi, FincaRaiz..." onchange="upd('+p.id+',\'url\',this.value)"/>';
    h+='<button class="url-btn url-btn-go" onclick="scrape('+p.id+')"'+(p.loading?' disabled':'')+'>🤖 Auto</button>';
    if(p.url)h+='<a class="url-btn url-btn-open" href="'+p.url+'" target="_blank">↗</a>';
    h+='</div>';
    
    h+=fg("Nombre / Identificador",p.id,"nombre","text");
    h+=fg("URL Foto",p.id,"foto","text");
    
    h+='<div class="sl">Información Básica</div>';
    h+=fg("Dirección / Zona",p.id,"direccion","text");
    h+='<div class="r2">'+fgSel("Tipo",p.id,"tipo",["Apartamento","Casa","Oficina","Local","Lote"])+fgSel("Estrato",p.id,"estrato",[0,1,2,3,4,5,6])+'</div>';
    h+='<div class="r3">'+fg("Área Total m²",p.id,"areaTotal","number")+fg("Área Privada m²",p.id,"areaPrivada","number")+fg("Antigüedad",p.id,"antiguedad","number")+'</div>';
    h+='<div class="r3">'+fg("Habitaciones",p.id,"habitaciones","number")+fg("Baños",p.id,"banos","number")+fg("Parqueaderos",p.id,"parqueaderos","number")+'</div>';
    h+='<div class="r3">'+fg("Piso",p.id,"piso","number")+fgSel("Vista",p.id,"vista",["Interior","Exterior","Panorámica"])+fgSel("Depósito",p.id,"deposito",["No","Sí"])+'</div>';
    h+=fgSel("Estado",p.id,"estado",["Obra gris","Original","Remodelado parcial","Remodelado total","Nuevo"]);
    
    h+='<div class="sl">Valores Económicos</div>';
    h+=fg("Valor de Lista",p.id,"valorLista","money");
    h+=fg("Valor Oferta (tu precio)",p.id,"valorOferta","money");
    // Calculated
    upd(p.id,"_m2t",fC(c.m2t));upd(p.id,"_m2p",fC(c.m2p));upd(p.id,"_desc",(c.desc>0?"-":"")+c.desc.toFixed(1)+"%");
    h+='<div class="r3">';
    h+='<div class="fg"><label>$/m² Total</label><input class="mn calc" readonly value="'+fC(c.m2t)+'"/></div>';
    h+='<div class="fg"><label>$/m² Privado</label><input class="mn calc" readonly value="'+fC(c.m2p)+'"/></div>';
    h+='<div class="fg"><label>Descuento</label><input class="mn '+(c.desc>0?"calc-g":"calc")+'" readonly value="'+(c.desc>0?"-":"")+c.desc.toFixed(1)+'%"/></div>';
    h+='</div>';
    
    h+='<div class="sl">Costos Recurrentes</div>';
    h+=fg("Administración / Mes",p.id,"adminMensual","money");
    h+='<div class="r2">'+fg("Predial / Año",p.id,"predialAnual","money")+fg("Servicios / Mes",p.id,"serviciosPromedio","money")+'</div>';
    h+=fg("Seguro Anual",p.id,"seguroAnual","money");
    h+='<div class="fg"><label>Costo Fijo Mensual</label><input class="mn calc" readonly value="'+fC(c.cm)+'"/></div>';
    
    h+='<div class="sl">Remodelación</div>';
    h+='<div class="r2">'+fgSel("¿Requiere?",p.id,"remodelado",["No","Sí"])+fg("Costo Remodelación",p.id,"valorRemodelacion","money")+'</div>';
    h+='<div class="r2"><div class="fg"><label>Costo Total Real</label><input class="mn calc-r" readonly value="'+fC(c.ct)+'"/></div><div class="fg"><label>$/m² Real</label><input class="mn calc-r" readonly value="'+fC(c.m2r)+'"/></div></div>';
    
    h+='<div class="sl">Notas</div>';
    h+=fg("Amenidades",p.id,"amenidades","text");
    h+=fg("Observaciones",p.id,"observaciones","text");
    
    h+='</div></div>';
  });
  ct.innerHTML=h;
}

function renderTable(){
  var el=document.getElementById("cmp-ct");
  if(props.length===0){el.innerHTML="<p>Agrega inmuebles.</p>";return}
  var h='<table><thead><tr><th style="text-align:left;min-width:150px">Característica</th>';
  props.forEach(function(p,i){
    h+='<th style="min-width:120px;color:'+COLORS[i%COLORS.length]+'">';
    if(p.foto)h+='<img src="'+p.foto+'" style="width:36px;height:27px;object-fit:cover;border-radius:3px;display:block;margin:0 0 3px auto"/>';
    h+=(p.nombre||"Inmueble "+(i+1))+'</th>';
  });
  h+='</tr></thead><tbody>';
  
  var rows=[
    {l:"Zona",f:function(p){return p.direccion||"—"},t:1},
    {l:"Tipo · Estrato",f:function(p){return p.tipo+" · E"+p.estrato},t:1},
    {l:"Área Total m²",f:function(p){return fN(p.areaTotal)},n:function(p){return p.areaTotal},b:"max"},
    {l:"Área Privada m²",f:function(p){return fN(p.areaPrivada)},n:function(p){return p.areaPrivada},b:"max"},
    {l:"Hab / Baños / Parq",f:function(p){return p.habitaciones+"/"+p.banos+"/"+p.parqueaderos},t:1},
    {l:"Estado",f:function(p){return p.estado},t:1},
    {l:"—",sep:1},
    {l:"Valor Lista",f:function(p){return fC(p.valorLista)}},
    {l:"Valor Oferta",f:function(p){return fC(p.valorOferta)},n:function(p){return p.valorOferta},b:"min"},
    {l:"Descuento",f:function(p){var c=C(p);return c.desc>0?"-"+c.desc.toFixed(1)+"%":"—"},n:function(p){return C(p).desc},b:"max"},
    {l:"$/m² Total",f:function(p){return fC(C(p).m2t)},n:function(p){return C(p).m2t||Infinity},b:"min"},
    {l:"—",sep:1},
    {l:"Admin/Mes",f:function(p){return fC(p.adminMensual)},n:function(p){return p.adminMensual},b:"min"},
    {l:"Costo Fijo/Mes",f:function(p){return fC(C(p).cm)},n:function(p){return C(p).cm},b:"min",hl:1},
    {l:"—",sep:1},
    {l:"Remodelación",f:function(p){return fC(p.valorRemodelacion)},n:function(p){return p.valorRemodelacion},b:"min"},
    {l:"Costo Total Real",f:function(p){return fC(C(p).ct)},n:function(p){return C(p).ct},b:"min",hl:1},
    {l:"$/m² Real",f:function(p){return fC(C(p).m2r)},n:function(p){return C(p).m2r||Infinity},b:"min",hl:1},
    {l:"Total 5 Años",f:function(p){return fC(C(p).c5)},n:function(p){return C(p).c5},b:"min",hl:1},
  ];
  
  rows.forEach(function(r){
    if(r.sep){h+='<tr><td colspan="'+(props.length+1)+'" style="padding:2px;background:#f8fafc;border:none"></td></tr>';return}
    var bi=-1,wi=-1;
    if(r.b&&r.n){
      var vs=props.map(function(p,i){return{v:r.n(p),i:i}}).filter(function(x){return x.v>0&&x.v<Infinity});
      if(vs.length>1){vs.sort(function(a,b){return r.b==="min"?a.v-b.v:b.v-a.v});bi=vs[0].i;wi=vs[vs.length-1].i}
    }
    h+='<tr'+(r.hl?' class="hl"':'')+'><td style="'+(r.hl?'font-weight:700':'')+'">'+r.l+'</td>';
    props.forEach(function(p,i){
      var cls=i===bi?"best":i===wi?"worst":"";
      h+='<td class="'+cls+'" style="'+(r.hl?'font-weight:700':'')+(r.t?';font-family:Outfit;':'')+'">'+(r.f(p))+'</td>';
    });
    h+='</tr>';
  });
  h+='</tbody></table>';
  el.innerHTML=h;
}

function renderRanking(){
  var el=document.getElementById("p-ranking");
  if(props.length<2){el.innerHTML='<div class="note note-y">Ingresa datos en al menos 2 inmuebles.</div>';return}
  
  var scored=props.map(function(p,i){
    var c=C(p);var s=0;var d=[];
    var m2s=props.map(function(x){return C(x).m2r||Infinity});
    var m2n=Math.min.apply(null,m2s.filter(function(v){return v>0&&v<Infinity}));
    var m2x=Math.max.apply(null,m2s.filter(function(v){return v>0&&v<Infinity}));
    if(m2x>m2n&&m2s[i]<Infinity&&m2s[i]>0){var sc=25*(1-(m2s[i]-m2n)/(m2x-m2n));s+=sc;d.push({l:"$/m²",s:Math.round(sc),m:25})}
    var ar=props.map(function(x){return x.areaTotal});var an=Math.min.apply(null,ar.filter(function(v){return v>0}));var ax=Math.max.apply(null,ar);
    if(ax>an&&p.areaTotal>0){var sc2=15*((p.areaTotal-an)/(ax-an));s+=sc2;d.push({l:"Área",s:Math.round(sc2),m:15})}
    var ms=props.map(function(x){return C(x).cm});var mn=Math.min.apply(null,ms.filter(function(v){return v>0}));var mx=Math.max.apply(null,ms);
    if(mx>mn&&ms[i]>0){var sc3=15*(1-(ms[i]-mn)/(mx-mn));s+=sc3;d.push({l:"Costo/Mes",s:Math.round(sc3),m:15})}
    var hx=Math.max.apply(null,props.map(function(x){return x.habitaciones}));
    if(hx>0){var sc4=10*(p.habitaciones/hx);s+=sc4;d.push({l:"Habitaciones",s:Math.round(sc4),m:10})}
    var ep=p.estado==="Remodelado total"||p.estado==="Nuevo"?10:p.estado==="Remodelado parcial"?5:0;s+=ep;d.push({l:"Estado",s:ep,m:10});
    var rp=p.remodelado==="No"?10:0;s+=rp;d.push({l:"Sin Remod.",s:rp,m:10});
    var pp=p.parqueaderos>0?5:0;s+=pp;d.push({l:"Parqueadero",s:pp,m:5});
    var dc=c.desc>0?Math.min(10,c.desc):0;s+=dc;d.push({l:"Descuento",s:Math.round(dc),m:10});
    return{p:p,idx:i,score:Math.round(s),details:d,c:c};
  }).sort(function(a,b){return b.score-a.score});
  
  var h='<div class="rank-grid">';
  scored.forEach(function(s,rank){
    var color=COLORS[s.idx%COLORS.length];
    var medal=rank===0?"🥇":rank===1?"🥈":rank===2?"🥉":"#"+(rank+1);
    h+='<div class="rank-card" style="border-top:4px solid '+color+'">';
    if(s.p.foto)h+='<div class="rank-photo" style="background-image:url('+s.p.foto+')"></div>';
    h+='<div class="rank-body"><div style="font-size:20px">'+medal+'</div><div class="rank-score" style="color:'+color+'">'+s.score+'</div><div class="rank-name">'+(s.p.nombre||"Sin nombre")+'</div><div style="font-size:10px;color:#94a3b8">'+s.p.direccion+'</div></div>';
    h+='<div class="rank-bar"><div class="rank-fill" style="width:'+s.score+'%;background:'+color+'"></div></div>';
    h+='<div class="rank-details">';
    s.details.forEach(function(d){h+='<div class="rank-row"><span style="color:#64748b">'+d.l+'</span><span style="font-family:JetBrains Mono;font-weight:600">'+d.s+'/'+d.m+'</span></div>'});
    h+='<div class="rank-summary">'+fC(s.c.pr)+' · '+fC(s.c.m2t)+'/m² · '+fC(s.c.cm)+'/mes</div>';
    h+='</div></div>';
  });
  h+='</div>';
  h+='<div class="note note-b">$/m² (25pts) · Área (15pts) · Costo mensual (15pts) · Habitaciones (10pts) · Estado (10pts) · Sin remodelación (10pts) · Parqueadero (5pts) · Descuento (10pts)</div>';
  el.innerHTML=h;
}

// Init
for(var i=0;i<3;i++)props.push(E());
render();
</script>
